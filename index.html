<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IBC Entries | Professional Intake</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-slate-50 min-h-screen font-sans">

<div class="max-w-7xl mx-auto px-4 py-10">
    <header class="flex flex-col md:flex-row md:items-center justify-between mb-10 gap-6">
        <div>
            <h1 class="text-4xl font-extrabold text-slate-900 tracking-tight">Service Intake</h1>
            <p class="text-slate-500 mt-1">Real-time customer database for IBC Entries.</p>
        </div>
        <div class="flex gap-3">
            <button onclick="exportToCSV()" class="bg-white border border-slate-200 text-slate-700 px-5 py-2.5 rounded-xl font-semibold shadow-sm hover:bg-slate-50 transition flex items-center">
                <i class="fas fa-file-export mr-2 text-blue-500"></i> Export CSV
            </button>
            <div class="bg-blue-600 text-white px-5 py-2.5 rounded-xl font-semibold shadow-lg shadow-blue-200 flex items-center">
                <i class="fas fa-cloud mr-2"></i> System Online
            </div>
        </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
        <aside class="lg:col-span-4">
            <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 sticky top-10">
                <h2 class="text-xl font-bold mb-6 text-slate-800">Register New Item</h2>
                <form id="customerForm" class="space-y-5">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Customer Identity</label>
                        <input type="text" id="name" placeholder="Full Name" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition">
                    </div>
                   
                    <div class="grid grid-cols-1 gap-4">
                        <input type="email" id="email" placeholder="Email Address" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                        <input type="tel" id="phone" placeholder="Phone Number" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Service Details</label>
                        <select id="reason" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none mb-3">
                            <option>General Repair</option>
                            <option>Warranty Claim</option>
                            <option>Maintenance</option>
                            <option>Battery Replacement</option>
                            <option>Screen Repair</option>
                        </select>
                        <input type="text" id="item" required placeholder="Item Description (e.g. iPhone 14)" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="text-[10px] font-bold text-slate-400 uppercase">Purchase Date</label>
                            <input type="date" id="purchaseDate" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm">
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-slate-400 uppercase">Intake Date</label>
                            <input type="date" id="takenDate" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm">
                        </div>
                    </div>

                    <button type="submit" id="submitBtn" class="w-full bg-slate-900 hover:bg-black text-white font-bold py-4 rounded-xl shadow-xl transition-all transform active:scale-[0.98] flex justify-center items-center mt-4">
                        <i class="fas fa-save mr-2"></i> Save to Cloud
                    </button>
                </form>
            </div>
        </aside>

        <main class="lg:col-span-8">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-6 border-b border-slate-100 flex flex-col md:flex-row justify-between items-center gap-4">
                    <h3 class="font-bold text-slate-800 text-lg">Active Service Records</h3>
                    <div class="relative w-full md:w-72">
                        <input type="text" id="searchInput" placeholder="Search by name or phone..." class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-full text-sm outline-none focus:ring-2 focus:ring-blue-400 transition">
                        <i class="fas fa-search absolute left-4 top-3.5 text-slate-400 text-xs"></i>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead>
                            <tr class="bg-slate-50 text-[11px] uppercase tracking-widest text-slate-500 font-bold border-b border-slate-100">
                                <th class="px-6 py-4">Customer Info</th>
                                <th class="px-6 py-4">Item & Status</th>
                                <th class="px-6 py-4">Timeline</th>
                                <th class="px-6 py-4 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="entriesTable" class="divide-y divide-slate-50">
                            </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCkEY53b__7G3FxxJoKINCGAfbCnzeLSNQ",
        authDomain: "ibcentries.firebaseapp.com",
        projectId: "ibcentries",
        storageBucket: "ibcentries.firebasestorage.app",
        messagingSenderId: "944504818551",
        appId: "1:944504818551:web:3f1c01e3961e11553c6f72",
        measurementId: "G-9702L9TD11"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const entriesCollection = collection(db, "customers");

    let allEntries = []; // Local cache for filtering

    // SAVE DATA
    document.getElementById('customerForm').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-2"></i> Syncing...';

        try {
            await addDoc(entriesCollection, {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                reason: document.getElementById('reason').value,
                item: document.getElementById('item').value,
                purchaseDate: document.getElementById('purchaseDate').value,
                takenDate: document.getElementById('takenDate').value,
                createdAt: new Date()
            });
            Swal.fire({ icon: 'success', title: 'Entry Saved', toast: true, position: 'top-end', showConfirmButton: false, timer: 3000 });
            e.target.reset();
        } catch (err) {
            Swal.fire({ icon: 'error', title: 'Upload Failed', text: err.message });
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-save mr-2"></i> Save to Cloud';
        }
    };

    // READ & DISPLAY DATA
    const q = query(entriesCollection, orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
        allEntries = [];
        const tableBody = document.getElementById('entriesTable');
        tableBody.innerHTML = '';
       
        snapshot.forEach((doc) => {
            const data = { id: doc.id, ...doc.data() };
            allEntries.push(data);
            renderRow(data);
        });
    });

    function renderRow(data) {
        const tableBody = document.getElementById('entriesTable');
        const row = `
            <tr class="hover:bg-slate-50/80 transition group">
                <td class="px-6 py-5">
                    <div class="font-bold text-slate-900">${data.name}</div>
                    <div class="text-xs text-slate-400 font-medium">${data.phone} • ${data.email}</div>
                </td>
                <td class="px-6 py-5">
                    <span class="inline-block px-2 py-1 bg-blue-50 text-blue-600 rounded text-[10px] font-bold uppercase mb-1">${data.reason}</span>
                    <div class="text-sm text-slate-600">${data.item}</div>
                </td>
                <td class="px-6 py-5">
                    <div class="text-[11px] text-slate-500 italic">In: ${data.takenDate}</div>
                    <div class="text-[11px] text-slate-400">Pur: ${data.purchaseDate || 'N/A'}</div>
                </td>
                <td class="px-6 py-5 text-right">
                    <button onclick="window.deleteEntry('${data.id}')" class="p-2 text-slate-300 hover:text-red-500 transition">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </td>
            </tr>
        `;
        tableBody.insertAdjacentHTML('beforeend', row);
    }

    // SEARCH FILTER
    document.getElementById('searchInput').oninput = (e) => {
        const term = e.target.value.toLowerCase();
        const tableBody = document.getElementById('entriesTable');
        tableBody.innerHTML = '';
        allEntries.filter(entry =>
            entry.name.toLowerCase().includes(term) ||
            entry.phone.includes(term)
        ).forEach(renderRow);
    };

    // DELETE ACTION
    window.deleteEntry = async (id) => {
        const result = await Swal.fire({
            title: 'Delete Record?',
            text: "This cannot be undone in the database.",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#ef4444',
            confirmButtonText: 'Yes, Delete'
        });

        if(result.isConfirmed) {
            await deleteDoc(doc(db, "customers", id));
            Swal.fire({ icon: 'success', title: 'Deleted', toast: true, position: 'top-end', showConfirmButton: false, timer: 2000 });
        }
};

    // EXPORT TO CSV
    window.exportToCSV = () => {
        if (allEntries.length === 0) return;
        const headers = ["Name", "Email", "Phone", "Reason", "Item", "PurchaseDate", "IntakeDate"];
        const csvRows = [headers.join(",")];
       
        allEntries.forEach(entry => {
            const values = [
                `"${entry.name}"`, `"${entry.email}"`, `"${entry.phone}"`,
                `"${entry.reason}"`, `"${entry.item}"`, `"${entry.purchaseDate}"`, `"${entry.takenDate}"`
            ];
            csvRows.push(values.join(","));
        });

        const blob = new Blob([csvRows.join("\n")], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `IBC_Entries_${new Date().toLocaleDateString()}.csv`;
        a.click();
    };
</script>

</body>
</html>
