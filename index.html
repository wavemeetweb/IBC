<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IBC Customer Management System</title>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  />
  <style>
    :root {
      --primary-color: #3b82f6;
      --primary-dark: #1e40af;
      --success-color: #10b981;
      --error-color: #ef4444;
      --warning-color: #f59e0b;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --gray-400: #9ca3af;
      --gray-500: #6b7280;
      --gray-600: #4b5563;
      --gray-700: #374151;
      --gray-800: #1f2937;
      --gray-900: #111827;
      --white: #ffffff;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1),
        0 1px 2px 0 rgba(0, 0, 0, 0.06);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1),
        0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1),
        0 4px 6px -2px rgba(0, 0, 0, 0.05);
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1),
        0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      line-height: 1.6;
    }
    .hidden {
      display: none !important;
    }
    /* Login Page Styles */
    .login-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .login-card {
      background: var(--white);
      border-radius: 16px;
      box-shadow: var(--shadow-xl);
      padding: 40px;
      width: 100%;
      max-width: 400px;
      animation: fadeInUp 0.6s ease-out;
    }
    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .login-icon {
      font-size: 48px;
      color: var(--primary-color);
      margin-bottom: 16px;
    }
    .login-header h1 {
      color: var(--gray-800);
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .login-header p {
      color: var(--gray-500);
      font-size: 14px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--gray-700);
      font-weight: 600;
      margin-bottom: 8px;
    }
    .form-control {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid var(--gray-200);
      border-radius: 8px;
      font-size: 16px;
      transition: all 0.3s ease;
      background-color: var(--white);
    }
    .form-control:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn--primary {
      background-color: var(--primary-color);
      color: var(--white);
    }
    .btn--primary:hover {
      background-color: var(--primary-dark);
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }
    .btn--full-width {
      width: 100%;
    }
    .error-message {
      background-color: #fef2f2;
      border: 1px solid #fecaca;
      color: var(--error-color);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 14px;
    }
    .success-message {
      background-color: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: var(--success-color);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 14px;
    }
    /* Dashboard Styles */
    .dashboard {
      min-height: 100vh;
      background: var(--gray-100);
    }
    .navbar {
      background: var(--white);
      box-shadow: var(--shadow);
      padding: 16px 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .nav-brand i {
      font-size: 24px;
      color: var(--primary-color);
    }
    .nav-brand h1 {
      color: var(--gray-800);
      font-size: 20px;
    }
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .welcome-text {
      color: var(--gray-600);
      font-size: 14px;
    }
    .main-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 20px;
    }
    .dashboard-tabs {
      display: flex;
      background: var(--white);
      border-radius: 12px;
      padding: 8px;
      margin-bottom: 32px;
      box-shadow: var(--shadow);
    }
    .tab-button {
      flex: 1;
      padding: 16px 24px;
      background: transparent;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      color: var(--gray-600);
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .tab-button.active {
      background: var(--primary-color);
      color: var(--white);
      box-shadow: var(--shadow);
    }
    .section {
      background: var(--white);
      border-radius: 12px;
      padding: 32px;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
    }
    .section-header {
      margin-bottom: 32px;
    }
    .section-title {
      color: var(--gray-800);
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .section-description {
      color: var(--gray-600);
    }
    .form-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }
    .customer-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }
    .stat-card {
      background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
      color: var(--white);
      padding: 24px;
      border-radius: 12px;
      text-align: center;
    }
    .stat-card i {
      font-size: 32px;
      margin-bottom: 12px;
      opacity: 0.8;
    }
    .stat-number {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .stat-label {
      font-size: 14px;
      opacity: 0.9;
    }
    .search-box {
      position: relative;
      margin-bottom: 24px;
    }
    .search-box i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gray-400);
    }
    .search-box input {
      padding-left: 48px;
    }
    .customer-list {
      display: grid;
      gap: 16px;
    }
    .customer-card {
      background: var(--white);
      border: 1px solid var(--gray-200);
      border-radius: 12px;
      padding: 20px;
      transition: all 0.3s ease;
    }
    .customer-card:hover {
      border-color: var(--primary-color);
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }
    .customer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .customer-mobile {
      font-size: 18px;
      font-weight: 700;
      color: var(--gray-800);
    }
    .customer-name {
      font-size: 18px;
      font-weight: 600;
      color: var(--primary-dark);
      margin-left: 12px;
    }
    .customer-date {
      font-size: 14px;
      color: var(--gray-500);
      background: var(--gray-100);
      padding: 4px 12px;
      border-radius: 16px;
    }
    .customer-email {
      color: var(--gray-600);
      font-size: 14px;
    }
    .customer-email.empty {
      color: var(--gray-400);
      font-style: italic;
    }
    .customer-reason {
      margin-top: 12px;
      font-style: italic;
      color: var(--gray-500);
      font-size: 14px;
    }
    .no-customers {
      text-align: center;
      color: var(--gray-500);
      padding: 40px;
    }
    .no-customers i {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
    .fade-in {
      animation: fadeIn 0.3s ease-out;
    }
  </style>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
  <div id="loginPage" class="login-container">
    <div class="login-card">
      <div class="login-header">
        <i class="fas fa-users login-icon"></i>
        <h1>IBC Customer Management</h1>
        <p>Staff Portal Access</p>
      </div>
      <form id="loginForm" class="login-form">
        <div class="form-group">
          <label for="staffId" class="form-label">
            <i class="fas fa-id-badge"></i>
            Staff ID
          </label>
          <input
            type="text"
            id="staffId"
            class="form-control"
            placeholder="Enter your staff ID"
            required
          />
        </div>
        <div class="form-group">
          <label for="password" class="form-label">
            <i class="fas fa-lock"></i>
            Password
          </label>
          <input
            type="password"
            id="password"
            class="form-control"
            placeholder="Enter your password"
            required
          />
        </div>
        <div id="loginError" class="error-message hidden"></div>
        <button
          type="submit"
          class="btn btn--primary btn--full-width login-btn"
        >
          <i class="fas fa-sign-in-alt"></i>
          Sign In
        </button>
      </form>
    </div>
  </div>

  <div id="dashboard" class="dashboard hidden">
    <nav class="navbar">
      <div class="nav-content">
        <div class="nav-brand">
          <i class="fas fa-users"></i>
          <h1>IBC Customer Management</h1>
        </div>
        <div class="nav-actions">
          <span class="welcome-text">Welcome, Staff Member</span>
          <button id="logoutBtn" class="btn btn--primary">
            <i class="fas fa-sign-out-alt"></i> Logout
          </button>
        </div>
      </div>
    </nav>

    <main class="main-content">
      <div class="dashboard-tabs">
        <button
          id="addCustomerTab"
          class="tab-button active"
          onclick="showSection('add')"
        >
          <i class="fas fa-plus"></i> Add Customer
        </button>
        <button
          id="viewCustomersTab"
          class="tab-button"
          onclick="showSection('view')"
        >
          <i class="fas fa-eye"></i> View Customers
        </button>
      </div>

      <div id="addCustomerSection" class="section">
        <div class="section-header">
          <h2 class="section-title">Add New Customer</h2>
          <p class="section-description">
            Enter customer details to add them to the system
          </p>
        </div>

        <form id="customerForm">
          <div class="form-row">
            <div class="form-group">
              <label for="customerName" class="form-label"
                ><i class="fas fa-user"></i> Customer Name</label
              >
              <input
                type="text"
                id="customerName"
                class="form-control"
                placeholder="Enter full name"
                required
              />
            </div>
            <div class="form-group">
              <label for="customerDate" class="form-label"
                ><i class="fas fa-calendar"></i> Date</label
              >
              <input type="date" id="customerDate" class="form-control" required />
            </div>
            <div class="form-group">
              <label for="customerMobile" class="form-label"
                ><i class="fas fa-phone"></i> Mobile Number
                <span style="color: var(--error-color);">*</span></label
              >
              <input
                type="tel"
                id="customerMobile"
                class="form-control"
                placeholder="Enter 10-digit mobile number"
                pattern="[0-9]{10}"
                maxlength="10"
                required
              />
            </div>
            <div class="form-group">
              <label for="customerEmail" class="form-label"
                ><i class="fas fa-envelope"></i> Email (Optional)</label
              >
              <input
                type="email"
                id="customerEmail"
                class="form-control"
                placeholder="Enter email address"
              />
            </div>
            <div class="form-group">
              <label for="customerReason" class="form-label"
                ><i class="fas fa-question-circle"></i> Reason for Visit</label
              >
              <input
                type="text"
                id="customerReason"
                class="form-control"
                placeholder="Why is the customer coming?"
                required
              />
            </div>
          </div>

          <div id="customerFormError" class="error-message hidden"></div>
          <div id="customerFormSuccess" class="success-message hidden"></div>

          <button type="submit" class="btn btn--primary">
            <i class="fas fa-plus"></i> Add Customer
          </button>
        </form>
      </div>

      <div id="viewCustomersSection" class="section hidden">
        <div class="section-header">
          <h2 class="section-title">Customer Database</h2>
          <p class="section-description">
            View and search through all customer records
          </p>
        </div>

        <div class="customer-stats">
          <div class="stat-card">
            <i class="fas fa-users"></i>
            <div class="stat-number" id="customerCount">0</div>
            <div class="stat-label">Total Customers</div>
          </div>
        </div>

        <div class="search-box">
          <i class="fas fa-search"></i>
          <input
            type="text"
            id="customerSearch"
            class="form-control"
            placeholder="Search by name, mobile number, email or reason..."
          />
        </div>

        <div id="customerList" class="customer-list"></div>
      </div>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCguyjHO82e0UXY78da4GLLDMpC2mvYV8Y",
      authDomain: "ibc-entries.firebaseapp.com",
      projectId: "ibc-entries",
      storageBucket: "ibc-entries.firebasestorage.app",
      messagingSenderId: "868975786760",
      appId: "1:868975786760:web:88c82632d6e563a955cabd",
      measurementId: "G-7JDE75ZLND",
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const customersRef = database.ref("customers");

    let isLoggedIn = false;
    let customers = [];

    const LOGIN_CREDENTIALS = {
      username: "IbcParalakhemundi",
      password: "ibc@123",
    };

    const loginPage = document.getElementById("loginPage");
    const dashboard = document.getElementById("dashboard");
    const loginForm = document.getElementById("loginForm");
    const loginError = document.getElementById("loginError");
    const logoutBtn = document.getElementById("logoutBtn");
    const addCustomerSection = document.getElementById("addCustomerSection");
    const viewCustomersSection = document.getElementById("viewCustomersSection");
    const customerForm = document.getElementById("customerForm");
    const customerFormError = document.getElementById("customerFormError");
    const customerFormSuccess = document.getElementById("customerFormSuccess");
    const customerSearch = document.getElementById("customerSearch");
    const customerList = document.getElementById("customerList");
    const customerCount = document.getElementById("customerCount");

    document.addEventListener("DOMContentLoaded", function () {
      initializeApp();
      setupEventListeners();
      setCurrentDate();

      customersRef.on("value", (snapshot) => {
        customers = [];
        snapshot.forEach((childSnap) => {
          const customer = childSnap.val();
          customers.push(customer);
        });
        renderCustomers();
      });
    });

    function initializeApp() {
      isLoggedIn = localStorage.getItem("ibc_logged_in") === "true";
      if (isLoggedIn) {
        showDashboard();
      } else {
        showLogin();
      }
    }

    function setupEventListeners() {
      loginForm.addEventListener("submit", handleLogin);
      logoutBtn.addEventListener("click", handleLogout);
      customerForm.addEventListener("submit", handleAddCustomer);
      customerSearch.addEventListener("input", handleCustomerSearch);
    }

    function setCurrentDate() {
      const dateField = document.getElementById("customerDate");
      const today = new Date().toISOString().split("T")[0];
      dateField.value = today;
    }

    function handleLogin(e) {
      e.preventDefault();
      const staffId = document.getElementById("staffId").value;
      const password = document.getElementById("password").value;
      if (
        staffId === LOGIN_CREDENTIALS.username &&
        password === LOGIN_CREDENTIALS.password
      ) {
        isLoggedIn = true;
        localStorage.setItem("ibc_logged_in", "true");
        hideError();
        showDashboard();
      } else {
        showError("Invalid Staff ID or Password. Please try again.");
      }
    }

    function handleLogout() {
      isLoggedIn = false;
      localStorage.removeItem("ibc_logged_in");
      showLogin();
    }

    function handleAddCustomer(e) {
      e.preventDefault();
      const name = document.getElementById("customerName").value.trim();
      const date = document.getElementById("customerDate").value;
      const mobile = document.getElementById("customerMobile").value.trim();
      const email = document.getElementById("customerEmail").value.trim();
      const reason = document.getElementById("customerReason").value.trim();
      if (!name || !date || !mobile || !reason) {
        showFormError("Please fill in all required fields.");
        return;
      }
      if (!/^[0-9]{10}$/.test(mobile)) {
        showFormError("Please enter a valid 10-digit mobile number.");
        return;
      }
      if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showFormError("Please enter a valid email address.");
        return;
      }
      if (customers.some((cust) => cust.mobile === mobile)) {
        showFormError("A customer with this mobile number already exists.");
        return;
      }
      const newCustomer = {
        id: Date.now(),
        name,
        date,
        mobile,
        email: email || "",
        reason,
      };
      customersRef.push(newCustomer, (error) => {
        if (error) {
          showFormError("Failed to add customer, please try again.");
        } else {
          customerForm.reset();
          setCurrentDate();
          showFormSuccess(`Customer ${name} added successfully!`);
        }
      });
    }

    function handleCustomerSearch(e) {
      const searchTerm = e.target.value.toLowerCase();
      const filteredCustomers = customers.filter(
        (customer) =>
          (customer.name &&
            customer.name.toLowerCase().includes(searchTerm)) ||
          customer.mobile.includes(searchTerm) ||
          (customer.email &&
            customer.email.toLowerCase().includes(searchTerm)) ||
          (customer.reason &&
            customer.reason.toLowerCase().includes(searchTerm))
      );
      renderCustomers(filteredCustomers);
    }

    function renderCustomers(customerList = customers) {
      const container = document.getElementById("customerList");
      const countElement = document.getElementById("customerCount");
      countElement.textContent = customers.length;
      if (customerList.length === 0) {
        container.innerHTML = `
          <div class="no-customers">
            <i class="fas fa-users"></i>
            <h3>No customers found</h3>
            <p>${
              customers.length === 0
                ? "Start by adding your first customer!"
                : "Try adjusting your search terms."
            }</p>
          </div>
        `;
        return;
      }
      container.innerHTML = customerList
        .map(
          (customer) => `
          <div class="customer-card fade-in">
            <div class="customer-header">
              <div class="customer-mobile">
                <i
                  class="fas fa-phone"
                  style="margin-right: 8px; color: var(--primary-color);"
                ></i>
                ${customer.mobile}
                <span class="customer-name"> - ${customer.name}</span>
              </div>
              <div class="customer-date">
                <i class="fas fa-calendar" style="margin-right: 4px;"></i>
                ${formatDate(customer.date)}
              </div>
            </div>
            <div class="customer-email ${
              customer.email ? "" : "empty"
            }">
              <i
                class="fas fa-envelope"
                style="margin-right: 8px; color: var(--gray-400);"
              ></i>
              ${customer.email || "No email provided"}
            </div>
            <div class="customer-reason">
              <i
                class="fas fa-question-circle"
                style="margin-right: 8px; color: var(--gray-400);"
              ></i>
              Reason: ${customer.reason}
            </div>
          </div>
        `
        )
        .join("");
    }

    function formatDate(dateString) {
      const date = new Date(dateString);
      return date.toLocaleDateString("en-US", {
        year: "numeric",
        month: "short",
        day: "numeric",
      });
    }

    function showError(message) {
      loginError.textContent = message;
      loginError.classList.remove("hidden");
    }
    function hideError() {
      loginError.classList.add("hidden");
    }
    function showFormError(message) {
      customerFormError.textContent = message;
      customerFormError.classList.remove("hidden");
      customerFormSuccess.classList.add("hidden");
    }
    function showFormSuccess(message) {
      customerFormSuccess.textContent = message;
      customerFormSuccess.classList.remove("hidden");
      customerFormError.classList.add("hidden");
      setTimeout(() => {
        customerFormSuccess.classList.add("hidden");
      }, 5000);
    }
    function hideFormMessages() {
      customerFormError.classList.add("hidden");
      customerFormSuccess.classList.add("hidden");
    }
    window.showSection = showSection;
  </script>
</body>
</html>
