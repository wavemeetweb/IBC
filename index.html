<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IBC COMPUTERS AND SYSTEMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .table-container { max-height: 60vh; overflow-y: auto; }
        .custom-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="bg-slate-50 dark:bg-zinc-950 text-slate-900 dark:text-zinc-100 min-h-screen">

    <div id="login-modal" class="fixed inset-0 bg-slate-900/90 flex items-center justify-center z-[100] backdrop-blur-sm">
        <div class="bg-white dark:bg-zinc-900 rounded-3xl shadow-2xl w-full max-w-md mx-4 p-10 text-center">
            <div class="w-20 h-20 bg-blue-600 text-white rounded-2xl flex items-center justify-center text-4xl mx-auto mb-6 shadow-lg shadow-blue-500/30">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h1 class="text-2xl font-bold">IBC Systems Login</h1>
            <p class="text-slate-500 dark:text-zinc-400 text-sm mt-2 mb-8">Authorized Access Only</p>
            
            <input id="password-input" type="password" placeholder="Enter System Password"
                   class="w-full px-6 py-4 rounded-xl bg-slate-100 dark:bg-zinc-800 border-2 border-transparent focus:border-blue-500 outline-none transition-all text-center text-lg"
                   onkeypress="if(event.key==='Enter') login()">
            
            <button onclick="login()" class="w-full mt-6 py-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition-all active:scale-95 shadow-lg shadow-blue-500/20">
                UNLOCK DATABASE
            </button>
        </div>
    </div>

    <div id="main-app" class="hidden">
        <nav class="bg-white dark:bg-zinc-900 border-b border-slate-200 dark:border-zinc-800 sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="bg-blue-600 p-2 rounded-lg text-white"><i class="fa-solid fa-desktop"></i></div>
                    <span class="font-bold text-xl tracking-tight">IBC <span class="text-blue-600">COMPUTERS</span></span>
                </div>
                <div class="flex items-center gap-4">
                    <button onclick="toggleDarkMode()" class="text-slate-500 hover:text-blue-600 transition-colors"><i class="fa-solid fa-circle-half-stroke text-xl"></i></button>
                    <button onclick="logout()" class="bg-red-50 dark:bg-red-900/20 text-red-600 px-4 py-2 rounded-lg text-sm font-bold hover:bg-red-600 hover:text-white transition-all">Logout</button>
                </div>
            </div>
        </nav>

        <main class="max-w-7xl mx-auto px-6 py-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
                <div class="bg-white dark:bg-zinc-900 p-6 rounded-2xl border border-slate-200 dark:border-zinc-800 custom-shadow">
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">Database Size</p>
                    <h2 id="total-count" class="text-4xl font-bold text-blue-600 mt-2">0</h2>
                </div>
                <div class="md:col-span-2 bg-white dark:bg-zinc-900 p-6 rounded-2xl border border-slate-200 dark:border-zinc-800 custom-shadow flex flex-col md:flex-row gap-4">
                    <div class="flex-grow relative">
                        <i class="fa-solid fa-magnifying-glass absolute left-4 top-4 text-slate-400"></i>
                        <input id="search-input" type="text" placeholder="Quick Search Name or Phone..." onkeyup="filterTable()"
                               class="w-full pl-12 pr-4 py-3.5 bg-slate-50 dark:bg-zinc-800 rounded-xl outline-none focus:ring-2 focus:ring-blue-500/20 border border-transparent">
                    </div>
                    <button onclick="exportCSV()" class="bg-slate-900 dark:bg-zinc-100 text-white dark:text-black px-6 py-3 rounded-xl font-bold flex items-center justify-center gap-2 hover:opacity-90">
                        <i class="fa-solid fa-file-export"></i> EXPORT CSV
                    </button>
                </div>
            </div>

            <div class="bg-white dark:bg-zinc-900 rounded-3xl p-8 border border-slate-200 dark:border-zinc-800 custom-shadow mb-10">
                <h3 class="text-lg font-bold mb-6 flex items-center gap-2 text-blue-600"><i class="fa-solid fa-plus-circle"></i> NEW CUSTOMER REGISTRATION</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                    <div class="lg:col-span-1">
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-2">Customer Name</label>
                        <input id="name" type="text" class="w-full px-4 py-3 bg-slate-50 dark:bg-zinc-800 rounded-xl border-none" placeholder="Enter Full Name">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-2">Phone Number</label>
                        <input id="phone" type="tel" class="w-full px-4 py-3 bg-slate-50 dark:bg-zinc-800 rounded-xl border-none" placeholder="10 Digits">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-2">Service Type</label>
                        <input id="service" list="services" class="w-full px-4 py-3 bg-slate-50 dark:bg-zinc-800 rounded-xl border-none" placeholder="e.g. Repair">
                        <datalist id="services">
                            <option value="Laptop Repair"><option value="Desktop Assembly"><option value="CCTV Setup"><option value="Software Update">
                        </datalist>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-2">State</label>
                        <select id="state" class="w-full px-4 py-3 bg-slate-50 dark:bg-zinc-800 rounded-xl border-none"></select>
                    </div>
                </div>
                <button onclick="saveCustomer()" class="w-full mt-8 py-4 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-cloud-arrow-up"></i> SAVE TO SECURE DATABASE
                </button>
            </div>

            <div class="bg-white dark:bg-zinc-900 rounded-3xl border border-slate-200 dark:border-zinc-800 overflow-hidden custom-shadow">
                <div class="table-container">
                    <table class="w-full text-left">
                        <thead class="bg-slate-50 dark:bg-zinc-800/50 sticky top-0 border-b border-slate-100 dark:border-zinc-800">
                            <tr class="text-[10px] text-slate-400 font-black uppercase tracking-widest">
                                <th class="px-6 py-4">Client</th>
                                <th class="px-6 py-4">Contact</th>
                                <th class="px-6 py-4">Service</th>
                                <th class="px-6 py-4">Location</th>
                                <th class="px-6 py-4">Registration Date</th>
                                <th class="px-6 py-4 w-10"></th>
                            </tr>
                        </thead>
                        <tbody id="table-body" class="divide-y divide-slate-100 dark:divide-zinc-800"></tbody>
                    </table>
                </div>
                <div id="empty-state" class="hidden py-20 text-center text-slate-400">
                    <i class="fa-solid fa-inbox text-4xl mb-3"></i>
                    <p>No customer records found</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Update this with your actual Firebase config from console
        const firebaseConfig = {
            apiKey: "AIzaSyCguyjHO82e0UXY78da4GLLDMpC2mvYV8Y",
            authDomain: "ibc-entries.firebaseapp.com",
            projectId: "ibc-entries",
            storageBucket: "ibc-entries.firebasestorage.app",
            messagingSenderId: "868975786760",
            appId: "1:868975786760:web:88c82632d6e563a955cabd"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        let customers = [];
        let unsubscribe = null;

        const indianStates = ["Andhra Pradesh","Arunachal Pradesh","Assam","Bihar","Chhattisgarh","Delhi","Goa","Gujarat","Haryana","Himachal Pradesh","Jharkhand","Karnataka","Kerala","Madhya Pradesh","Maharashtra","Manipur","Meghalaya","Mizoram","Nagaland","Odisha","Punjab","Rajasthan","Sikkim","Tamil Nadu","Telangana","Tripura","Uttar Pradesh","Uttarakhand","West Bengal"];

        function populateStates() {
            const sel = document.getElementById("state");
            indianStates.forEach(s => {
                const o = document.createElement("option"); o.value = s; o.textContent = s; sel.appendChild(o);
            });
            sel.value = "Odisha";
        }

        function login() {
            const pass = document.getElementById("password-input").value.trim();
            if (!pass) return alert("Please enter password");
            auth.signInWithEmailAndPassword("durga.mahapatra@ibcsystems.co.in", pass)
                .catch(e => alert("❌ Login Failed. Check your password."));
        }

        function logout() { auth.signOut(); }

        function toggleDarkMode() {
            document.documentElement.classList.toggle("dark");
            localStorage.setItem("darkMode", document.documentElement.classList.contains("dark"));
        }

        function loadCustomers() {
            if (unsubscribe) unsubscribe();
            unsubscribe = db.collection("customers").orderBy("timestamp", "desc").onSnapshot(snap => {
                customers = snap.docs.map(d => ({id: d.id, ...d.data()}));
                document.getElementById("total-count").textContent = customers.length;
                filterTable();
            });
        }

        function saveCustomer() {
            const name = document.getElementById("name").value.trim();
            const phone = document.getElementById("phone").value.trim();
            const service = document.getElementById("service").value.trim();
            const state = document.getElementById("state").value;

            if (!name || !phone || !service) return alert("Please fill all fields");

            db.collection("customers").add({
                name, phone, service, state,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                document.querySelectorAll("input").forEach(i => i.value = "");
                alert("Success!");
            });
        }

        function renderTable(data) {
            const tbody = document.getElementById("table-body");
            tbody.innerHTML = "";
            document.getElementById("empty-state").classList.toggle("hidden", data.length > 0);
            data.forEach(c => {
                const dt = c.timestamp ? new Date(c.timestamp.toDate()).toLocaleDateString('en-IN') : "...";
                const tr = document.createElement("tr");
                tr.className = "hover:bg-slate-50 dark:hover:bg-zinc-800/50 transition-colors text-sm";
                tr.innerHTML = `
                    <td class="px-6 py-4 font-bold">${c.name}</td>
                    <td class="px-6 py-4 text-blue-600">${c.phone}</td>
                    <td class="px-6 py-4"><span class="bg-slate-100 dark:bg-zinc-800 px-2 py-1 rounded text-xs">${c.service}</span></td>
                    <td class="px-6 py-4 text-slate-500">${c.state}</td>
                    <td class="px-6 py-4 text-xs font-medium text-slate-400">${dt}</td>
                    <td class="px-6 py-4"><button onclick="deleteCustomer('${c.id}')" class="text-slate-300 hover:text-red-500"><i class="fa-solid fa-trash"></i></button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function deleteCustomer(id) {
            if (confirm("Delete this entry?")) db.collection("customers").doc(id).delete();
        }

        function filterTable() {
            const term = document.getElementById("search-input").value.toLowerCase();
            const filtered = customers.filter(c => c.name.toLowerCase().includes(term) || c.phone.includes(term));
            renderTable(filtered);
        }

        function exportCSV() {
            let csv = "Name,Phone,Service,State\n";
            customers.forEach(c => csv += `"${c.name}","${c.phone}","${c.service}","${c.state}"\n`);
            const blob = new Blob([csv], {type: 'text/csv'});
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "IBC_Customers.csv";
            a.click();
        }

        auth.onAuthStateChanged(user => {
            document.getElementById("login-modal").classList.toggle("hidden", !!user);
            document.getElementById("main-app").classList.toggle("hidden", !user);
            if (user) loadCustomers();
        });

        window.onload = () => {
            populateStates();
            if (localStorage.getItem("darkMode") === "true") document.documentElement.classList.add("dark");
        };
    </script>
</body>
</html>
