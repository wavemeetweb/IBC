<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Customer Book - India</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600&display=swap');
        body { font-family: 'Inter', system-ui, sans-serif; }
        .tail-container { max-width: 1280px; margin: 0 auto; }
        .card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .table-container { max-height: 65vh; overflow-y: auto; }
    </style>
</head>
<body class="bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 min-h-screen">
    <!-- Login Modal -->
    <div id="login-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-[100]">
        <div class="bg-white dark:bg-zinc-900 rounded-3xl shadow-2xl w-full max-w-md mx-4 overflow-hidden">
            <div class="px-8 pt-10 pb-8 text-center">
                <div class="inline-flex w-20 h-20 bg-gradient-to-br from-orange-500 to-amber-500 text-white text-6xl rounded-3xl mb-6 items-center justify-center shadow-inner">🇮🇳</div>
                <h1 class="text-3xl font-bold tracking-tight">Family Customer Book</h1>
                <p class="text-amber-600 dark:text-amber-400 mt-1">Secure • Real-time • India</p>
            </div>
            <div class="px-8 pb-10">
                <input id="password-input" type="password" placeholder="Family Password"
                       class="w-full px-6 py-4 rounded-2xl bg-zinc-100 dark:bg-zinc-800 border border-transparent focus:border-amber-500 text-lg outline-none"
                       onkeypress="if(event.key==='Enter') login()">
                <button onclick="login()" 
                        class="mt-6 w-full py-4 bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-semibold rounded-2xl text-lg active:scale-95 transition-all">
                    UNLOCK SECURE APP
                </button>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div id="main-app" class="hidden min-h-screen">
        <header class="bg-white dark:bg-zinc-900 border-b border-zinc-200 dark:border-zinc-800 sticky top-0 z-50">
            <div class="tail-container px-6 py-5 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 bg-gradient-to-br from-orange-500 to-amber-500 rounded-2xl flex items-center justify-center text-2xl">🇮🇳</div>
                    <h1 class="font-bold text-2xl tracking-tighter">Family Customer Book</h1>
                </div>
                <div class="flex items-center gap-3">
                    <button onclick="toggleDarkMode()" id="theme-btn" class="w-10 h-10 rounded-2xl hover:bg-zinc-100 dark:hover:bg-zinc-800 flex items-center justify-center">
                        <i class="fa-solid fa-moon text-xl"></i>
                    </button>
                    <button onclick="copyShareLink()" class="flex items-center gap-2 px-5 py-2.5 bg-zinc-100 dark:bg-zinc-800 rounded-3xl text-sm font-medium">
                        <i class="fa-solid fa-share"></i> Share Link
                    </button>
                    <button onclick="logout()" class="px-5 py-2.5 text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30 rounded-3xl text-sm font-medium">Logout</button>
                </div>
            </div>
        </header>

        <div class="tail-container px-6 py-8">
            <div class="flex flex-col md:flex-row gap-6 mb-8">
                <div class="bg-white dark:bg-zinc-900 rounded-3xl p-6 flex-1 shadow card">
                    <div class="uppercase text-xs tracking-widest text-zinc-500">Total Customers</div>
                    <div id="total-count" class="text-6xl font-semibold text-orange-600 dark:text-orange-400 mt-1">0</div>
                </div>
                <div class="bg-white dark:bg-zinc-900 rounded-3xl p-6 flex-1 shadow card">
                    <input id="search-input" type="text" placeholder="Search name or phone..." onkeyup="filterTable()"
                           class="w-full bg-zinc-100 dark:bg-zinc-800 rounded-3xl px-6 py-4 focus:ring-2 focus:ring-amber-400 outline-none">
                    <button onclick="exportCSV()" class="mt-4 w-full py-3 bg-emerald-500 hover:bg-emerald-600 text-white font-medium rounded-3xl flex items-center justify-center gap-2">
                        <i class="fa-solid fa-file-csv"></i> EXPORT CSV
                    </button>
                </div>
            </div>

            <!-- Form -->
            <div class="bg-white dark:bg-zinc-900 rounded-3xl shadow card p-8 mb-10">
                <h2 class="text-xl font-semibold mb-6 flex items-center gap-3"><i class="fa-solid fa-circle-plus text-amber-500"></i> Add New Customer</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <div><label class="block text-xs font-medium text-zinc-500 mb-2">FULL NAME</label><input id="name" type="text" class="w-full px-5 py-3.5 bg-zinc-100 dark:bg-zinc-800 rounded-3xl outline-none focus:border-amber-500 border border-transparent" placeholder="Aarav Patel"></div>
                    <div><label class="block text-xs font-medium text-zinc-500 mb-2">PHONE NUMBER <span id="phone-tick" class="ml-2 text-lg"></span></label><input id="phone" type="tel" oninput="validatePhone(this)" class="w-full px-5 py-3.5 bg-zinc-100 dark:bg-zinc-800 rounded-3xl outline-none focus:border-amber-500 border border-transparent" placeholder="+919876543210"></div>
                    <div><label class="block text-xs font-medium text-zinc-500 mb-2">EMAIL</label><input id="email" type="email" oninput="validateEmail(this)" class="w-full px-5 py-3.5 bg-zinc-100 dark:bg-zinc-800 rounded-3xl outline-none focus:border-amber-500 border border-transparent" placeholder="customer@email.com"></div>
                    <div><label class="block text-xs font-medium text-zinc-500 mb-2">HOUSE / STREET</label><input id="house" type="text" class="w-full px-5 py-3.5 bg-zinc-100 dark:bg-zinc-800 rounded-3xl outline-none focus:border-amber-500 border border-transparent" placeholder="12, Gandhi Marg"></div>
                    <div><label class="block text-xs font-medium text-zinc-500 mb-2">CITY / TOWN</label><input id="city" type="text" class="w-full px-5 py-3.5 bg-zinc-100 dark:bg-zinc-800 rounded-3xl outline-none focus:border-amber-500 border border-transparent" placeholder="Surat"></div>
                    <div><label class="block text-xs font-medium text-zinc-500 mb-2">STATE / UT</label><select id="state" class="w-full px-5 py-3.5 bg-zinc-100 dark:bg-zinc-800 rounded-3xl outline-none focus:border-amber-500 border border-transparent"></select></div>
                    <div><label class="block text-xs font-medium text-zinc-500 mb-2">PIN CODE <span id="pin-tick" class="ml-2 text-lg"></span></label><input id="pin" type="text" maxlength="6" oninput="validatePin(this)" class="w-full px-5 py-3.5 bg-zinc-100 dark:bg-zinc-800 rounded-3xl outline-none focus:border-amber-500 border border-transparent" placeholder="395001"></div>
                    <div class="lg:col-span-3"><label class="block text-xs font-medium text-zinc-500 mb-2">SERVICE / ITEM</label><input id="service" list="service-list" type="text" class="w-full px-5 py-3.5 bg-zinc-100 dark:bg-zinc-800 rounded-3xl outline-none focus:border-amber-500 border border-transparent" placeholder="AC Repair"><datalist id="service-list"><option value="Plumbing"><option value="Electrical"><option value="AC Repair"><option value="Painting"><option value="Carpentry"><option value="Cleaning"><option value="Grocery Delivery"><option value="Other"></datalist></div>
                </div>
                <button onclick="saveCustomer()" class="mt-8 w-full py-4 bg-gradient-to-r from-orange-500 to-amber-500 text-white font-semibold rounded-3xl text-lg active:scale-95 flex items-center justify-center gap-3">
                    <i class="fa-solid fa-floppy-disk"></i> SAVE TO FAMILY BOOK
                </button>
            </div>

            <!-- Table -->
            <div class="bg-white dark:bg-zinc-900 rounded-3xl shadow card overflow-hidden">
                <div class="px-8 py-5 border-b flex items-center justify-between bg-zinc-50 dark:bg-zinc-950">
                    <h3 class="font-semibold">All Customers • Live &amp; Secure</h3>
                    <div class="flex items-center gap-2 text-emerald-600 text-xs"><div class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></div> REAL-TIME SYNC</div>
                </div>
                <div class="table-container">
                    <table class="w-full">
                        <thead class="bg-zinc-50 dark:bg-zinc-800 sticky top-0">
                            <tr>
                                <th class="px-6 py-5 text-left text-xs font-medium text-zinc-500">NAME</th>
                                <th class="px-6 py-5 text-left text-xs font-medium text-zinc-500">PHONE</th>
                                <th class="px-6 py-5 text-left text-xs font-medium text-zinc-500">EMAIL</th>
                                <th class="px-6 py-5 text-left text-xs font-medium text-zinc-500">ADDRESS</th>
                                <th class="px-6 py-5 text-left text-xs font-medium text-zinc-500">SERVICE</th>
                                <th class="px-6 py-5 text-left text-xs font-medium text-zinc-500">DATE &amp; TIME</th>
                                <th class="w-12"></th>
                            </tr>
                        </thead>
                        <tbody id="table-body" class="divide-y divide-zinc-200 dark:divide-zinc-700 text-sm"></tbody>
                    </table>
                </div>
                <div id="empty-state" class="hidden py-20 text-center text-zinc-400">
                    <i class="fa-solid fa-inbox text-6xl mb-4"></i><p>No customers yet</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCguyjHO82e0UXY78da4GLLDMpC2mvYV8Y",
            authDomain: "ibc-entries.firebaseapp.com",
            projectId: "ibc-entries",
            storageBucket: "ibc-entries.firebasestorage.app",
            messagingSenderId: "868975786760",
            appId: "1:868975786760:web:88c82632d6e563a955cabd"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let customers = [];
        let unsubscribe = null;

        const indianStates = ["Andaman and Nicobar Islands","Andhra Pradesh","Arunachal Pradesh","Assam","Bihar","Chandigarh","Chhattisgarh","Dadra and Nagar Haveli and Daman and Diu","Delhi","Goa","Gujarat","Haryana","Himachal Pradesh","Jammu and Kashmir","Jharkhand","Karnataka","Kerala","Ladakh","Lakshadweep","Madhya Pradesh","Maharashtra","Manipur","Meghalaya","Mizoram","Nagaland","Odisha","Puducherry","Punjab","Rajasthan","Sikkim","Tamil Nadu","Telangana","Tripura","Uttar Pradesh","Uttarakhand","West Bengal"];

        function populateStates() {
            const sel = document.getElementById("state");
            indianStates.forEach(s => {
                const o = document.createElement("option"); o.value = s; o.textContent = s; sel.appendChild(o);
            });
        }

        function validatePhone(i) { const v = i.value.trim(); const t = document.getElementById("phone-tick"); if(!v){t.textContent="";i.classList.remove("border-green-500","border-red-500");return;} const ok = /^(\+91|0)[6-9]\d{9}$/.test(v); t.textContent=ok?"✅":"❌"; t.className=ok?"ml-2 text-green-500":"ml-2 text-red-500"; i.classList.toggle("border-green-500",ok); i.classList.toggle("border-red-500",!ok); }
        function validateEmail(i) { const v = i.value.trim(); if(!v){i.classList.remove("border-green-500","border-red-500");return;} const ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); i.classList.toggle("border-green-500",ok); i.classList.toggle("border-red-500",!ok); }
        function validatePin(i) { const v = i.value.trim(); const t = document.getElementById("pin-tick"); if(!v){t.textContent="";i.classList.remove("border-green-500","border-red-500");return;} const ok = /^\d{6}$/.test(v); t.textContent=ok?"✅":"❌"; t.className=ok?"ml-2 text-green-500":"ml-2 text-red-500"; i.classList.toggle("border-green-500",ok); i.classList.toggle("border-red-500",!ok); }

        function login() {
            const pass = document.getElementById("password-input").value.trim();
            if (!pass) return alert("Enter family password");
            auth.signInWithEmailAndPassword("family@customerbook.in", pass)
                .catch(e => alert("❌ Wrong password\n" + e.message));
        }

        function logout() {
            if (confirm("Logout from Family Book?")) auth.signOut();
        }

        function toggleDarkMode() {
            document.documentElement.classList.toggle("dark");
            localStorage.setItem("darkMode", document.documentElement.classList.contains("dark"));
            document.getElementById("theme-btn").innerHTML = document.documentElement.classList.contains("dark") ? `<i class="fa-solid fa-sun text-xl"></i>` : `<i class="fa-solid fa-moon text-xl"></i>`;
        }

        function loadCustomers() {
            if (unsubscribe) unsubscribe();
            unsubscribe = db.collection("customers").orderBy("timestamp", "desc").onSnapshot(snap => {
                customers = snap.docs.map(d => ({id: d.id, ...d.data()}));
                document.getElementById("total-count").textContent = customers.length;
                filterTable();
            });
        }

        function saveCustomer() {
            const name = document.getElementById("name").value.trim();
            const phone = document.getElementById("phone").value.trim();
            if (!name || !phone || !document.getElementById("state").value || !document.getElementById("service").value) return alert("Name, Phone, State & Service required");

            db.collection("customers").add({
                name, phone,
                email: document.getElementById("email").value.trim(),
                house: document.getElementById("house").value.trim(),
                city: document.getElementById("city").value.trim(),
                state: document.getElementById("state").value,
                pin: document.getElementById("pin").value.trim(),
                service: document.getElementById("service").value.trim(),
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                document.querySelectorAll("#name,#phone,#email,#house,#city,#pin,#service").forEach(el => el.value = "");
                document.getElementById("phone-tick").textContent = document.getElementById("pin-tick").textContent = "";
                alert("✅ Saved successfully!");
            }).catch(e => alert("Error: " + e.message));
        }

        function deleteCustomer(id) {
            if (confirm("Delete permanently?")) db.collection("customers").doc(id).delete();
        }

        function renderTable(data) {
            const tbody = document.getElementById("table-body");
            tbody.innerHTML = "";
            document.getElementById("empty-state").classList.toggle("hidden", data.length > 0);
            data.forEach(c => {
                const addr = [c.house, c.city, c.state, c.pin].filter(Boolean).join(", ");
                const dt = c.timestamp ? new Date(c.timestamp.toDate()).toLocaleString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}) : "—";
                const tr = document.createElement("tr");
                tr.className = "hover:bg-zinc-50 dark:hover:bg-zinc-800";
                tr.innerHTML = `
                    <td class="px-6 py-5 font-medium">${c.name}</td>
                    <td class="px-6 py-5 text-orange-600">${c.phone}</td>
                    <td class="px-6 py-5 text-zinc-500">${c.email||'—'}</td>
                    <td class="px-6 py-5 text-sm">${addr}</td>
                    <td class="px-6 py-5">${c.service}</td>
                    <td class="px-6 py-5 text-xs text-zinc-500">${dt}</td>
                    <td class="px-6 py-5"><button onclick="deleteCustomer('${c.id}')" class="text-red-500 hover:text-red-700"><i class="fa-solid fa-trash"></i></button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filterTable() {
            const term = document.getElementById("search-input").value.toLowerCase().trim();
            const filtered = term ? customers.filter(c => c.name.toLowerCase().includes(term) || c.phone.includes(term)) : customers;
            renderTable(filtered);
        }

        function exportCSV() {
            if (!customers.length) return alert("No data");
            let csv = "Name,Phone,Email,Address,Service,Date & Time\n";
            customers.forEach(c => {
                const addr = [c.house, c.city, c.state, c.pin].filter(Boolean).join(", ");
                const dt = c.timestamp ? new Date(c.timestamp.toDate()).toLocaleString('en-IN') : "";
                csv += `"${c.name.replace(/"/g,'""')}","${c.phone}","${c.email||''}","${addr.replace(/"/g,'""')}","${c.service}","${dt}"\n`;
            });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(new Blob([csv], {type: "text/csv"}));
            a.download = `family-customers-${new Date().toISOString().slice(0,10)}.csv`;
            a.click();
        }

        function copyShareLink() {
            navigator.clipboard.writeText(location.href).then(() => {
                const b = event.currentTarget;
                const old = b.innerHTML;
                b.innerHTML = `<i class="fa-solid fa-check"></i> Copied!`;
                setTimeout(() => b.innerHTML = old, 2000);
            });
        }

        // Auth state listener (handles login/logout automatically)
        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById("login-modal").classList.add("hidden");
                document.getElementById("main-app").classList.remove("hidden");
                loadCustomers();
            } else {
                document.getElementById("login-modal").classList.remove("hidden");
                document.getElementById("main-app").classList.add("hidden");
                if (unsubscribe) { unsubscribe(); unsubscribe = null; }
            }
        });

        window.onload = () => {
            populateStates();
            if (localStorage.getItem("darkMode") === "true") document.documentElement.classList.add("dark");
            document.getElementById("theme-btn").innerHTML = document.documentElement.classList.contains("dark") ? `<i class="fa-solid fa-sun text-xl"></i>` : `<i class="fa-solid fa-moon text-xl"></i>`;
        };
    </script>
</body>
</html>
